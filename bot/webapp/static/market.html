<style>

  body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  button { border: 0; border-radius: 10px; padding: 9px 13px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--bg2); color: var(--text); }
  button.primary { background: var(--btn); color: var(--btn-text); }
  button.accent { background: var(--accent); color: #fff; }
  button.danger { background: rgba(229,72,77,.12); color: var(--danger); }
  button:disabled { opacity: .5; }
  input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); background: var(--card); color: var(--text); font: inherit; outline: none; }
  textarea { min-height: 80px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }

  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand h1 { margin: 0; font-size: 18px; } .brand h1 span { color: var(--accent); }
  .brand small { color: var(--hint); font-size: 12px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 0; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }

  .count { color: var(--hint); font-size: 13px; margin: 2px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
  .count select { width: auto; padding: 4px 8px; font-size: 13px; border: 0; background: transparent; color: var(--link); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; position: relative; display: flex; flex-direction: column; }
  .item .img { aspect-ratio: 4/3; background: var(--bg2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .item .fav { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .item .st { position: absolute; top: 8px; left: 8px; }
  .item .b { padding: 8px 10px 10px; }
  .item .price { font-weight: 700; font-size: 15px; } .item .price small { color: var(--hint); font-weight: 500; font-size: 11px; }
  .item .t { font-size: 13px; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 36px; }
  .item .m { color: var(--hint); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { width: 100%; margin-top: 12px; padding: 12px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--bg); box-shadow: 0 -1px 0 rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom); }
  nav div { flex: 1; text-align: center; padding: 8px 0 6px; font-size: 11px; color: var(--hint); cursor: pointer; }
  nav div b { display: block; font-size: 20px; font-weight: 400; } nav div.active { color: var(--link); }
  nav div.post b { background: var(--accent); color: #fff; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; margin: -3px auto 2px; font-size: 22px; }

  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; }
  .gallery { position: relative; background: #000; }
  .gallery .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; } .gallery .track::-webkit-scrollbar { display: none; }
  .gallery img { width: 100%; flex: none; aspect-ratio: 4/3; object-fit: contain; scroll-snap-align: start; background: #000; }
  .gallery .dots { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: #fff; text-shadow: 0 0 4px #000; }
  .gallery .back { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.5); color: #fff; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .gallery .favbtn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.92); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .d { padding: 14px 16px 120px; }
  .d .price { font-size: 24px; font-weight: 800; } .d .price small { font-size: 13px; color: var(--hint); font-weight: 500; }
  .d h2 { margin: 6px 0 4px; font-size: 17px; } .d .meta { color: var(--hint); font-size: 13px; }
  .params { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin: 14px 0; }
  .params div { background: var(--bg2); border-radius: 10px; padding: 8px 10px; } .params div small { display: block; color: var(--hint); font-size: 11px; } .params div b { font-size: 14px; }
  .desc { white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
  .seller { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 12px; padding: 10px 12px; margin-top: 14px; }
  .seller .av { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; }
  .seller .n { font-weight: 600; font-size: 14px; } .seller .u { color: var(--hint); font-size: 12px; }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; box-shadow: 0 -1px 0 rgba(0,0,0,.08); }
  .cta button { flex: 1; padding: 13px; font-size: 15px; }

  .page { padding: 18px 16px 90px; max-width: 520px; margin: 0 auto; }
  .page h2 { margin: 0 0 4px; } .page p.sub { color: var(--hint); margin: 0 0 14px; font-size: 14px; }
  .roles { display: flex; gap: 8px; } .roles div { flex: 1; border: 2px solid transparent; background: var(--card); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; }
  .roles div.active { border-color: var(--btn); } .roles div b { display: block; font-size: 22px; }
  .actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; } .actions button { padding: 13px; font-size: 15px; }
  .fsheet { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .fbody { background: var(--bg); width: 100%; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }

<!-- registratsiya -->
<section id="reg" class="page hidden">
  <h2 data-i="reg_title"></h2>
  <p class="sub" id="reg-sub"></p>
  <label data-i="name"></label>
  <input id="r-name" maxlength="100">
  <label data-i="who"></label>
  <div class="roles">
    <div data-role="tenant" class="active"><b>🔑</b><span data-i="tenant"></span><br><small style="color:var(--hint)" data-i="tenant_sub"></small></div>
    <div data-role="landlord"><b>🏠</b><span data-i="landlord"></span><br><small style="color:var(--hint)" data-i="landlord_sub"></small></div>
  </div>
  <label data-i="phone"></label>
  <input id="r-phone" inputmode="tel" placeholder="+998 90 123 45 67">
  <div class="err" id="r-err"></div>
  <div class="actions">
    <button class="primary" id="r-contact" data-i="share_contact"></button>
    <button id="r-submit" data-i="continue"></button>
    <button id="r-cancel" data-i="cancel"></button>
  </div>
</section>

<!-- e'lon berish -->
<section id="post" class="page hidden">
  <h2 data-i="post_title"></h2>
  <p class="sub" data-i="post_sub"></p>
  <form id="post-form">
    <label><span data-i="p_title"></span> *</label><input name="title" required maxlength="120">
    <label><span data-i="p_address"></span> *</label><input name="address" required maxlength="250">
    <label data-i="p_district"></label><input name="district" maxlength="80" list="districts"><datalist id="districts"></datalist>
    <div class="row">
      <div><label><span data-i="p_rooms"></span> *</label><input name="rooms" type="number" min="1" max="50" required></div>
      <div><label data-i="p_area"></label><input name="area" type="number" min="1" step="0.1"></div>
    </div>
    <div class="row">
      <div><label data-i="p_floor"></label><input name="floor" type="number" min="0" max="200"></div>
      <div><label data-i="p_floors"></label><input name="floors" type="number" min="1" max="200"></div>
    </div>
    <div class="row">
      <div><label><span data-i="p_price"></span> *</label><input name="price" type="number" min="0" required></div>
      <div><label data-i="p_currency"></label><select name="currency"><option value="UZS">so'm</option><option value="USD">y.e ($)</option></select></div>
    </div>
    <label data-i="p_phone"></label><input name="contact_phone" maxlength="30">
    <label data-i="p_desc"></label><textarea name="description" maxlength="1500"></textarea>
    <label data-i="p_photos"></label><input name="photos" type="file" accept="image/*" multiple>
    <div class="err" id="p-err"></div>
    <div class="actions">
      <button type="submit" class="accent" id="p-submit" data-i="p_submit"></button>
      <button type="button" id="p-cancel" data-i="cancel"></button>
    </div>
  </form>
</section>

<!-- asosiy -->
<div id="app" class="hidden">
<header>
  <div class="brand"><h1>Chirchiq <span>Arenda</span></h1><small id="who"></small></div>
  <div class="searchrow"><input id="q"><button id="fbtn"></button></div>
  <div class="chips" id="roomchips">
    <span class="chip active" data-rooms="" data-i="c_all"></span>
    <span class="chip" data-rooms="1" data-i="c_r1"></span>
    <span class="chip" data-rooms="2" data-i="c_r2"></span>
    <span class="chip" data-rooms="3" data-i="c_r3"></span>
    <span class="chip" data-rooms="4" data-i="c_r4"></span>
  </div>
</header>
<main>
  <section id="page-feed">
    <div class="count"><span id="cnt"></span>
      <select id="sort"><option value="new" data-i="s_new"></option><option value="cheap" data-i="s_cheap"></option><option value="expensive" data-i="s_expensive"></option><option value="popular" data-i="s_popular"></option></select></div>
    <div class="grid" id="grid"></div>
    <button class="more hidden" id="more" data-i="more"></button>
  </section>
  <section id="page-fav" class="hidden">
    <div class="count"><span data-i="favs_title"></span></div>
    <div class="grid" id="favgrid"></div>
  </section>
  <section id="page-prof" class="hidden"></section>
</main>
<nav>
  <div class="active" data-page="feed"><b>🏠</b><span data-i="n_houses"></span></div>
  <div data-page="fav"><b>❤️</b><span data-i="n_favs"></span></div>
  <div class="post" data-page="post"><b>+</b><span data-i="n_post"></span></div>
  <div data-page="prof"><b>👤</b><span data-i="n_profile"></span></div>
</nav>
</div>

<div id="gate" class="center hidden">⚠️ <span data-i="gate"></span><div id="gate-msg" style="margin-top:8px;font-size:13px"></div></div>
<div id="detail" class="sheet hidden"></div>
<div id="fsheet" class="fsheet hidden">
  <div class="fbody">
    <h3 data-i="f_title"></h3>
    <label data-i="f_price"></label>
    <div class="row"><input id="f-min" inputmode="numeric"><input id="f-max" inputmode="numeric"></div>
    <label data-i="f_district"></label>
    <select id="f-district"></select>
    <div class="actions"><button id="f-reset" data-i="f_reset"></button><button class="primary" id="f-apply" data-i="f_apply"></button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

      pr_name: "Имя", pr_phone: "Телефон", pr_role: "Роль", pr_tg: "Telegram", pr_edit: "✏️ Изменить данные", pr_register: "📝 Зарегистрироваться", pr_not_registered: "Вы не зарегистрированы", pr_lang: "🌐 Язык", pr_info: "Объявления регулярно обновляются. Курс: 1 у.е. = {rate} сум.",
      f_title: "Фильтры", f_price: "Цена (сум / мес)", f_from: "от", f_to: "до", f_district: "Район", f_all: "Все", f_reset: "Сбросить", f_apply: "Показать",
      fav_on: "Добавлено в избранное", fav_off: "Удалено из избранного", lang_saved: "Язык сохранён", reg_saved: "Сохранено ✅",
    },
    en: {
      gate: "This page opens only inside Telegram.", search_ph: "Search: area, rooms, price...", filter: "⚙️ Filter", filter_on: "⚙️ Filter •",
      c_all: "All", c_r1: "1 room", c_r2: "2 rooms", c_r3: "3 rooms", c_r4: "4+ rooms",
      s_new: "Newest", s_cheap: "Cheap → expensive", s_expensive: "Expensive → cheap", s_popular: "Popular",
      count: "{n} listings", more: "Show more", loading: "Loading…", empty: "No listings found", favs_title: "❤️ Favorites",
      n_houses: "Housing", n_favs: "Favorites", n_post: "Post", n_profile: "Profile",
      per_month: "/ month", rooms: "rooms", now: "just now", hours: "{n} h ago", yesterday: "yesterday", days: "{n} d ago",
      d_rooms: "Rooms", d_area: "Area", d_floor: "Floor", d_district: "District", no_desc: "No description.", owner: "Owner / agent",
      call: "📞 Call", no_phone: "No phone provided", close: "Close",
      st_pending: "under review", st_approved: "approved", st_rejected: "rejected", reason: "Reason",
      reg_title: "👋 Welcome!", reg_sub: "Complete a short registration to continue.", reg_sub_post: "Please register before posting a listing.",
      name: "Your name", who: "Who are you?", tenant: "Tenant", tenant_sub: "looking for housing", landlord: "Landlord", landlord_sub: "I rent out",
      phone: "Phone number", share_contact: "📱 Share my Telegram number", continue: "Continue", cancel: "Cancel",
      err_name: "Enter your name.", err_phone: "Phone must look like +998XXXXXXXXX.", err_contact: "Number not shared. Enter it manually.", err_role: "Choose who you are.", err_browser: "Works only inside Telegram. Enter the number manually.",
      post_title: "➕ Post a listing", post_sub: "Your listing appears after an admin review.",
      p_title: "Title", p_address: "Address", p_district: "District / area", p_rooms: "Rooms", p_area: "Area, m²", p_floor: "Floor", p_floors: "Floors in building",
      p_price: "Price (per month)", p_currency: "Currency", p_phone: "Phone", p_desc: "Description", p_photos: "Photos (up to 8)", p_submit: "Submit for review", p_sending: "Sending…", p_sent: "Listing sent! It will appear after review.",
      my_title: "📋 My listings", my_empty: "You haven't posted anything yet.", delete: "🗑 Delete", delete_confirm: "Delete this listing?", deleted: "Deleted",
      pr_name: "Name", pr_phone: "Phone", pr_role: "Role", pr_tg: "Telegram", pr_edit: "✏️ Edit details", pr_register: "📝 Register", pr_not_registered: "Not registered", pr_lang: "🌐 Language", pr_info: "Listings are updated regularly. Rate: 1 USD = {rate} UZS.",
      f_title: "Filters", f_price: "Price (UZS / month)", f_from: "from", f_to: "to", f_district: "District", f_all: "All", f_reset: "Reset", f_apply: "Apply",
      fav_on: "Added to favorites", fav_off: "Removed from favorites", lang_saved: "Language saved", reg_saved: "Saved ✅",
    },
  };
  const LANG_NAMES = { uz: "🇺🇿 O'zbekcha", ru: "🇷🇺 Русский", en: "🇬🇧 English" };
  let lang = "uz";
  const tr = (k, vars) => { let s = (I18N[lang] && I18N[lang][k]) || I18N.uz[k] || k; if (vars) for (const v in vars) s = s.replace("{" + v + "}", vars[v]); return s; };
  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = tr(el.dataset.i); });
    $("#q").placeholder = tr("search_ph"); $("#fbtn").textContent = filtersOn() ? tr("filter_on") : tr("filter");
    $("#f-min").placeholder = tr("f_from"); $("#f-max").placeholder = tr("f_to");
    $("#r-name").placeholder = tr("name");
  }

  // ================= asoslar =================
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  if (tg) { tg.ready(); tg.expand(); }
  const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown" && tg.initDataUnsafe && tg.initDataUnsafe.query_id);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const priceStr = (h) => h.currency === "USD" ? `${money(h.price)} y.e` : `${money(h.price)} so'm`;
  const uzsStr = (h) => h.currency === "USD" && h.price_uzs ? `≈ ${money(h.price_uzs)} so'm` : "";
  const ago = (iso) => { const d = (Date.now() - new Date(iso)) / 36e5; if (d < 1) return tr("now"); if (d < 24) return tr("hours", { n: Math.floor(d) }); const days = Math.floor(d / 24); return days === 1 ? tr("yesterday") : tr("days", { n: days }); };
  let toastTimer; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }
  const haptic = (t) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
  const photo = (u) => u.startsWith("/api/photo/") ? u + "?_auth=" + encodeURIComponent(initData) : u;
  const confirmDlg = (msg) => new Promise((res) => { if (inTelegram && tg.showConfirm) tg.showConfirm(msg, res); else res(window.confirm(msg)); });
  const errText = (e) => ({ REGISTER_REQUIRED: tr("reg_sub_post"), NAME_REQUIRED: tr("err_name"), ROLE_REQUIRED: tr("err_role"), PHONE_INVALID: tr("err_phone"), NOT_FOUND: tr("empty") }[e.message.split(":")[0]] || e.message);

  async function api(path, opts = {}) {
    const headers = Object.assign({ Authorization: "tma " + initData }, opts.headers || {});
    const r = await fetch(path, Object.assign({}, opts, { headers }));
    if (!r.ok) { const e = new Error((await r.text()) || "HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  if (!initData) { $("#gate").classList.remove("hidden"); applyI18n(); return; }

  let me = null, role = "tenant", afterReg = null;
  const state = { q: "", rooms: "", min: "", max: "", district: "", sort: "new", page: 0, items: [], favs: [] };
  const filtersOn = () => !!(state.min || state.max || state.district);

  // ================= sahifalar =================
  function show(page) {
    ["reg", "post", "app"].forEach((id) => $("#" + id).classList.toggle("hidden", id !== page));
    window.scrollTo(0, 0);
  }
  function showApp(tab) {
    show("app"); $("#who").textContent = me.registered ? me.full_name : "";
    if (tab) selectTab(tab);
  }
  function selectTab(p) {
    document.querySelectorAll("nav div").forEach((x) => x.classList.toggle("active", x.dataset.page === p));
    $("#page-feed").classList.toggle("hidden", p !== "feed"); $("#page-fav").classList.toggle("hidden", p !== "fav"); $("#page-prof").classList.toggle("hidden", p !== "prof");
    $("header").classList.toggle("hidden", p !== "feed");
    if (p === "fav") loadFavs(); if (p === "prof") renderProfile();
  }
  document.querySelectorAll("nav div").forEach((t) => t.addEventListener("click", () => {
    if (t.dataset.page === "post") { openPost(); return; }
    selectTab(t.dataset.page);
  }));

  // ================= registratsiya =================
  document.querySelectorAll(".roles div").forEach((d) => d.addEventListener("click", () => { document.querySelectorAll(".roles div").forEach((x) => x.classList.toggle("active", x === d)); role = d.dataset.role; }));
  function openReg(forPost) {
    afterReg = forPost ? "post" : null;
    $("#reg-sub").textContent = forPost ? tr("reg_sub_post") : tr("reg_sub");
    $("#r-name").value = me.full_name || me.tg_name || ""; $("#r-phone").value = me.phone || ""; $("#r-err").textContent = "";
    role = me.role || "tenant"; document.querySelectorAll(".roles div").forEach((x) => x.classList.toggle("active", x.dataset.role === role));
    $("#r-contact").classList.toggle("hidden", !inTelegram);
    show("reg");
  }
  async function register(payload) {
    $("#r-err").textContent = "";
    const name = $("#r-name").value.trim();
    if (name.length < 2) { $("#r-err").textContent = tr("err_name"); return; }
    try {
      const u = await api("/api/market/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ full_name: name, role }, payload)) });
      Object.assign(me, u); haptic("success"); toast(tr("reg_saved"));
      if (afterReg === "post") { afterReg = null; openPost(); } else showApp("prof");
    } catch (e) { haptic("error"); $("#r-err").textContent = errText(e); }
  }
  $("#r-submit").addEventListener("click", () => register({ phone: $("#r-phone").value }));
  $("#r-cancel").addEventListener("click", () => showApp());
  $("#r-contact").addEventListener("click", () => {
    if (!(inTelegram && tg.requestContact)) { $("#r-err").textContent = tr("err_browser"); return; }
    tg.requestContact((ok, resp) => { if (!ok) { $("#r-err").textContent = tr("err_contact"); return; } register({ contact_response: resp && resp.response }); });
  });

  // ================= e'lon berish =================
  function openPost() {
    if (!me.registered) { openReg(true); return; }
    const f = $("#post-form"); f.reset(); f.contact_phone.value = me.phone || ""; $("#p-err").textContent = "";
    show("post");
  }
  $("#p-cancel").addEventListener("click", () => showApp());
  $("#post-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = $("#p-submit"); b.disabled = true; b.textContent = tr("p_sending"); $("#p-err").textContent = "";
    try {
      await api("/api/market/my", { method: "POST", body: new FormData($("#post-form")) });
      haptic("success"); toast(tr("p_sent")); showApp("prof");
    } catch (err) { haptic("error"); $("#p-err").textContent = errText(err); }
    finally { b.disabled = false; b.textContent = tr("p_submit"); }
  });

  // ================= lenta =================
  let qTimer; $("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $("#q").value; loadFeed(true); }, 350); });
  document.querySelectorAll("#roomchips .chip").forEach((c) => c.addEventListener("click", () => { document.querySelectorAll("#roomchips .chip").forEach((x) => x.classList.toggle("active", x === c)); state.rooms = c.dataset.rooms; loadFeed(true); }));
  $("#sort").addEventListener("change", () => { state.sort = $("#sort").value; loadFeed(true); });
  $("#more").addEventListener("click", () => loadFeed(false));
  $("#fbtn").addEventListener("click", () => $("#fsheet").classList.remove("hidden"));
  $("#fsheet").addEventListener("click", (e) => { if (e.target === $("#fsheet")) $("#fsheet").classList.add("hidden"); });
  $("#f-apply").addEventListener("click", () => { state.min = $("#f-min").value.replace(/\D/g, ""); state.max = $("#f-max").value.replace(/\D/g, ""); state.district = $("#f-district").value; $("#fsheet").classList.add("hidden"); $("#fbtn").textContent = filtersOn() ? tr("filter_on") : tr("filter"); loadFeed(true); });
  $("#f-reset").addEventListener("click", () => { $("#f-min").value = ""; $("#f-max").value = ""; $("#f-district").value = ""; $("#f-apply").click(); });
  async function loadDistricts() {
    try { const ds = await api("/api/market/districts"); $("#f-district").innerHTML = `<option value="">${tr("f_all")}</option>` + ds.map((d) => `<option>${esc(d)}</option>`).join(""); $("#districts").innerHTML = ds.map((d) => `<option value="${esc(d)}">`).join(""); } catch (e) {}
  }
  async function loadFeed(reset) {
    if (reset) { state.page = 0; state.items = []; $("#grid").innerHTML = `<div class="center" style="grid-column:1/-1">${tr("loading")}</div>`; }
    const p = new URLSearchParams({ q: state.q, rooms: state.rooms, price_min: state.min, price_max: state.max, district: state.district, sort: state.sort, page: state.page });
    try {
      const r = await api("/api/market/houses?" + p);
      state.items = state.items.concat(r.items); state.page++;
      $("#more").classList.toggle("hidden", !r.has_more);
      renderGrid($("#grid"), state.items);
      $("#cnt").textContent = state.items.length ? tr("count", { n: state.items.length + (r.has_more ? "+" : "") }) : "";
    } catch (e) { $("#grid").innerHTML = `<div class="center" style="grid-column:1/-1">${esc(errText(e))}</div>`; }
  }
  function card(h) {
    return `<div class="item" data-id="${h.id}">
      <div class="img" style="${h.photos[0] ? `background-image:url('${photo(h.photos[0])}')` : ""}">${h.photos[0] ? "" : "🏠"}</div>
      <span class="fav" data-fav="${h.id}">${h.is_favorite ? "❤️" : "🤍"}</span>
      <div class="b">
        <div class="price">${priceStr(h)} <small>${tr("per_month")}</small></div>
        <div class="t">${esc(h.title)}</div>
        <div class="m">${h.rooms ? h.rooms + " " + tr("rooms") + " · " : ""}${h.area ? h.area + " m² · " : ""}${esc(h.district || h.address)}</div>
        <div class="m">${ago(h.published_at)}${h.views ? " · 👁 " + h.views : ""}</div>
      </div></div>`;
  }
  function renderGrid(el, items) { el.innerHTML = items.length ? items.map(card).join("") : `<div class="center" style="grid-column:1/-1">${tr("empty")}</div>`; }
  document.addEventListener("click", async (e) => {
    const f = e.target.closest("[data-fav]"); if (f) { e.stopPropagation(); await toggleFav(+f.dataset.fav); return; }
    const it = e.target.closest(".item"); if (it) openDetail(+it.dataset.id);
  });
  async function toggleFav(id) {
    try {
      const r = await api("/api/market/favorites/" + id, { method: "POST" });
      [state.items, state.favs].forEach((arr) => { const h = arr.find((x) => x.id === id); if (h) h.is_favorite = r.is_favorite; });
      if (!r.is_favorite) state.favs = state.favs.filter((x) => x.id !== id);
      document.querySelectorAll(`[data-fav="${id}"]`).forEach((el) => el.textContent = r.is_favorite ? "❤️" : "🤍");
      haptic("success"); toast(r.is_favorite ? tr("fav_on") : tr("fav_off"));
      if (!$("#page-fav").classList.contains("hidden")) renderGrid($("#favgrid"), state.favs);
    } catch (err) { toast(errText(err)); }
  }
  async function loadFavs() { try { state.favs = await api("/api/market/favorites"); renderGrid($("#favgrid"), state.favs); } catch (e) { $("#favgrid").innerHTML = `<div class="center" style="grid-column:1/-1">${esc(errText(e))}</div>`; } }

  // ================= tafsilot =================
  async function openDetail(id) {
    const el = $("#detail"); el.innerHTML = `<div class="center">${tr("loading")}</div>`; el.classList.remove("hidden");
    if (inTelegram && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeDetail); }
    let h; try { h = await api("/api/market/houses/" + id); } catch (e) { el.innerHTML = `<div class="center">${esc(errText(e))}<br><br><button id="dclose">${tr("close")}</button></div>`; $("#dclose").onclick = closeDetail; return; }
    const imgs = h.photos.length ? h.photos.map((p) => `<img src="${photo(p)}" loading="lazy" alt="">`).join("") : `<div style="width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:60px;color:#fff">🏠</div>`;
    const params = [h.rooms ? [tr("d_rooms"), h.rooms] : null, h.area ? [tr("d_area"), h.area + " m²"] : null, h.floor ? [tr("d_floor"), h.floor + (h.floors ? "/" + h.floors : "")] : null, h.district ? [tr("d_district"), h.district] : null]
      .filter(Boolean).map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join("");
    const tel = h.contact_phone ? h.contact_phone.replace(/[^\d+]/g, "") : "";
    el.innerHTML = `
      <div class="gallery"><div class="track" id="track">${imgs}</div><div class="back" id="dback">‹</div>
        <div class="favbtn" data-fav="${h.id}">${h.is_favorite ? "❤️" : "🤍"}</div>
        ${h.photos.length > 1 ? `<div class="dots" id="dots">1 / ${h.photos.length}</div>` : ""}</div>
      <div class="d">
        <div class="price">${priceStr(h)} <small>${tr("per_month")} ${uzsStr(h)}</small></div>
        ${h.status !== "approved" ? `<div style="margin:6px 0"><span class="badge ${h.status}">${tr("st_" + h.status)}</span>${h.reject_reason ? ` <span style="font-size:12px;color:var(--hint)">${tr("reason")}: ${esc(h.reject_reason)}</span>` : ""}</div>` : ""}
        <h2>${esc(h.title)}</h2>
        <div class="meta">📍 ${esc(h.address)} · ${ago(h.published_at)} · 👁 ${h.views}</div>
        ${params ? `<div class="params">${params}</div>` : ""}
        <div class="desc">${esc(h.description || tr("no_desc"))}</div>
        ${h.seller_name || h.seller_username ? `<div class="seller"><div class="av">👤</div><div><div class="n">${esc(h.seller_name || h.seller_username)}</div><div class="u">${tr("owner")}</div></div></div>` : ""}
      </div>
      <div class="cta">${tel ? `<button class="accent" id="call">${tr("call")}</button>` : `<button class="primary" disabled>${tr("no_phone")}</button>`}</div>`;
    $("#dback").onclick = closeDetail;
    const track = $("#track"); if (track && $("#dots")) track.addEventListener("scroll", () => { $("#dots").textContent = `${Math.round(track.scrollLeft / track.clientWidth) + 1} / ${h.photos.length}`; });
    if ($("#call")) $("#call").onclick = () => { location.href = "tel:" + tel; };
  }
  function closeDetail() { $("#detail").classList.add("hidden"); if (inTelegram && tg.BackButton) { tg.BackButton.hide(); tg.BackButton.offClick(closeDetail); } }

  // ================= profil + mening e'lonlarim =================
  async function renderProfile() {
    const el = $("#page-prof");
    const langBtns = Object.keys(LANG_NAMES).map((c) => `<button data-lang="${c}" class="${c === lang ? "active" : ""}">${LANG_NAMES[c]}</button>`).join("");
    el.innerHTML = `
      <div class="card"><div class="k">${tr("pr_lang")}</div><div class="langs" style="margin-top:8px">${langBtns}</div></div>
      ${me.registered ? `
        <div class="card"><div class="k">${tr("pr_name")}</div><div class="v">${esc(me.full_name)}</div></div>
        <div class="card"><div class="k">${tr("pr_phone")}</div><div class="v">${esc(me.phone || "—")}</div></div>
        <div class="card"><div class="k">${tr("pr_role")}</div><div class="v">${me.role === "landlord" ? "🏠 " + tr("landlord") : "🔑 " + tr("tenant")}</div></div>
        <button class="primary" id="edit" style="width:100%;padding:12px">${tr("pr_edit")}</button>`
      : `<div class="card"><div class="k">${tr("pr_name")}</div><div class="v">${esc(me.tg_name || "")}</div><div class="k" style="margin-top:6px">${tr("pr_not_registered")}</div></div>
         <button class="primary" id="edit" style="width:100%;padding:12px">${tr("pr_register")}</button>`}
      <div class="card"><div class="k">${tr("pr_tg")}</div><div class="v">${me.username ? "@" + esc(me.username) : "ID " + me.telegram_id}</div></div>
      <h3 style="margin:18px 0 8px">${tr("my_title")}</h3>
      <div id="myads"><div class="center">${tr("loading")}</div></div>
      <p style="color:var(--hint);font-size:12px;margin-top:14px">${tr("pr_info", { rate: money(me.usd_rate || 12500) })}</p>`;
    $("#edit").onclick = () => openReg(false);
    el.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", async () => {
      try { await api("/api/market/lang", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lang: b.dataset.lang }) }); lang = b.dataset.lang; me.lang = lang; applyI18n(); renderProfile(); renderGrid($("#grid"), state.items); toast(tr("lang_saved")); } catch (e) { toast(errText(e)); }
    }));
    try {
      const ads = me.registered ? await api("/api/market/my") : [];
      $("#myads").innerHTML = ads.length ? ads.map((h) => `
        <div class="myad" data-my="${h.id}">
          <div class="th" style="${h.photos[0] ? `background-image:url('${photo(h.photos[0])}')` : ""}">${h.photos[0] ? "" : "🏠"}</div>
          <div class="bd"><div class="t">${esc(h.title)} <span class="badge ${h.status}">${tr("st_" + h.status)}</span></div>
            <div class="m">${priceStr(h)} ${tr("per_month")} · ${h.rooms || "—"} ${tr("rooms")}</div>
            ${h.reject_reason ? `<div class="m">${tr("reason")}: ${esc(h.reject_reason)}</div>` : ""}
            <div style="margin-top:6px"><button class="danger" data-del="${h.id}">${tr("delete")}</button></div></div>
        </div>`).join("") : `<div class="center" style="padding:16px">${tr("my_empty")}</div>`;
      el.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async (ev) => {
        ev.stopPropagation(); if (!(await confirmDlg(tr("delete_confirm")))) return;
        try { await api("/api/market/my/" + b.dataset.del, { method: "DELETE" }); toast(tr("deleted")); renderProfile(); } catch (e) { toast(errText(e)); }
      }));
      el.querySelectorAll(".myad").forEach((c) => c.addEventListener("click", () => openDetail(+c.dataset.my)));
    } catch (e) { $("#myads").innerHTML = `<div class="center">${esc(errText(e))}</div>`; }
  }

  // ================= boot =================
  api("/api/market/me").then((m) => {
    me = m; lang = (I18N[m.lang] ? m.lang : "uz"); applyI18n();
    showApp(); loadDistricts(); loadFeed(true);
  }).catch((e) => { applyI18n(); $("#gate").classList.remove("hidden"); $("#gate-msg").textContent = e.message; });
})();
</script>
</body>
</html>

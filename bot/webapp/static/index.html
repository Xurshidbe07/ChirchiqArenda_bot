<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff); --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111); --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2481cc); --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff); --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --danger: #e5484d; --ok: #30a46c; --warn: #f5a524; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg2); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 90px; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 16px 0; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  header h1 { margin: 0 0 8px; font-size: 17px; display: flex; align-items: center; gap: 8px; justify-content: space-between; white-space: nowrap; }
  header h1 > span { overflow: hidden; text-overflow: ellipsis; }
  header h1 small { color: var(--hint); font-weight: 400; font-size: 12px; }
  header select { font-size: 12px; border: 0; background: var(--bg2); border-radius: 8px; padding: 4px 4px; color: var(--text); width: auto; flex: none; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1; text-align: center; padding: 10px 6px; border-bottom: 2px solid transparent; color: var(--hint); cursor: pointer; font-weight: 500; user-select: none; white-space: nowrap; font-size: 14px; }
  .tab.active { color: var(--link); border-color: var(--link); }
  main { padding: 12px 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .card.pending { border: 2px solid var(--warn); }
  .thumb { width: 72px; height: 72px; border-radius: 10px; background: var(--bg2) center/cover; flex: none; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .card .body { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; margin-bottom: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card .meta { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .price { margin-top: 4px; font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; color: #fff; font-weight: 600; }
  .badge.ok { background: var(--ok); } .badge.off { background: var(--hint); } .badge.danger { background: var(--danger); } .badge.warn { background: var(--warn); } .badge.violet { background: #5b3df5; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--bg2); color: var(--text); }
  button.primary { background: var(--btn); color: var(--btn-text); } button.danger { background: rgba(229,72,77,.12); color: var(--danger); } button.ok { background: rgba(48,164,108,.14); color: var(--ok); }
  button:disabled { opacity: .5; cursor: default; }
  .fab { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; background: var(--btn); color: var(--btn-text); border-radius: 999px; padding: 14px 20px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); font: inherit; margin-bottom: 10px; outline: none; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--card); color: var(--hint); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--btn); color: var(--btn-text); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--card); border-radius: var(--radius); padding: 16px; } .stat .n { font-size: 30px; font-weight: 700; } .stat .l { color: var(--hint); font-size: 13px; }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  .hidden { display: none !important; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  .sheet h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }
  input, textarea, select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .sheet .actions { margin-top: 14px; } .sheet .actions button { flex: 1; padding: 12px; font-size: 15px; }
  .reason { margin-top: 8px; display: flex; gap: 6px; } .reason input { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: .95; }
  .center { padding: 60px 20px; text-align: center; color: var(--hint); }
</style>
</head>
<body>
<header>
  <h1><span>🛠 <span data-i="title"></span> <small id="who"></small></span><select id="lang"><option value="uz">🇺🇿 UZ</option><option value="ru">🇷🇺 RU</option><option value="en">🇬🇧 EN</option></select></h1>
  <div class="tabs">
    <div class="tab active" data-tab="houses">🏠 <span data-i="t_houses"></span></div>
    <div class="tab" data-tab="users">👥 <span data-i="t_users"></span></div>
    <div class="tab" data-tab="stats">📊 <span data-i="t_stats"></span></div>
    <div class="tab hidden" data-tab="admins" id="tab-admins">🛡 <span data-i="t_admins"></span></div>
  </div>
</header>

<main>
  <section id="houses">
    <div class="chips">
      <span class="chip active" data-f="all" data-i="c_all"></span>
      <span class="chip" data-f="pending" id="chip-pending"></span>
      <span class="chip" data-f="active" data-i="c_active"></span>
      <span class="chip" data-f="hidden" data-i="c_hidden"></span>
      <span class="chip" data-f="clients" data-i="c_clients"></span>
      <span class="chip" data-f="joymee" data-i="c_auto"></span>
      <span class="chip" data-f="manual" data-i="c_manual"></span>
    </div>
    <div class="actions" style="margin:0 0 10px">
      <button class="primary" id="sync" data-i="sync"></button>
      <span id="sync-info" style="font-size:12px;color:var(--hint);align-self:center"></span>
    </div>
    <div id="houses-list"></div>
  </section>

  <section id="users" class="hidden">
    <input class="search" id="user-q">
    <div class="chips">
      <span class="chip active" data-b="all" data-i="c_all"></span>
      <span class="chip" data-b="0" data-i="u_active"></span>
      <span class="chip" data-b="1" data-i="u_blocked"></span>
    </div>
    <div id="users-list"></div>
  </section>

  <section id="stats" class="hidden"><div class="stats" id="stats-grid"></div></section>

  <section id="admins" class="hidden">
    <div class="card" style="display:block">
      <div style="font-weight:600;margin-bottom:6px" data-i="a_add_title"></div>
      <div class="row"><input id="a-id" inputmode="numeric"><input id="a-note"></div>
      <div class="actions"><button class="primary" id="a-add" data-i="a_add"></button></div>
      <div style="font-size:12px;color:var(--hint);margin-top:6px" data-i="a_hint"></div>
    </div>
    <div id="admins-list"></div>
  </section>

  <div id="gate" class="center hidden">⚠️ <span data-i="gate"></span><div id="gate-msg" style="margin-top:8px;font-size:13px"></div></div>
</main>

<button class="fab" id="fab" data-i="add_house"></button>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <h2 data-i="new_house"></h2>
    <form id="house-form">
      <label><span data-i="f_title"></span> *</label><input name="title" required maxlength="120">
      <label><span data-i="f_address"></span> *</label><input name="address" required maxlength="250">
      <label data-i="f_district"></label><input name="district" maxlength="80">
      <div class="row">
        <div><label><span data-i="f_rooms"></span> *</label><input name="rooms" type="number" min="1" max="50" required></div>
        <div><label data-i="f_area"></label><input name="area" type="number" min="1" step="0.1"></div>
      </div>
      <div class="row">
        <div><label><span data-i="f_price"></span> *</label><input name="price" type="number" min="0" required></div>
        <div><label data-i="f_currency"></label><select name="currency"><option value="UZS">so'm</option><option value="USD">y.e ($)</option></select></div>
      </div>
      <div class="row">
        <div><label data-i="f_floor"></label><input name="floor" type="number" min="0" max="200"></div>
        <div><label data-i="f_floors"></label><input name="floors" type="number" min="1" max="200"></div>
      </div>
      <label data-i="f_phone"></label><input name="contact_phone" maxlength="30" placeholder="+998901234567">
      <label data-i="f_desc"></label><textarea name="description" maxlength="1500"></textarea>
      <label data-i="f_photos"></label><input name="photos" type="file" accept="image/*" multiple>
      <div class="actions">
        <button type="button" id="cancel" data-i="cancel"></button>
        <button type="submit" class="primary" id="save" data-i="save"></button>
      </div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

  function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
  const confirmDlg = (msg) => new Promise((res) => { if (inTelegram && tg.showConfirm) tg.showConfirm(msg, res); else res(window.confirm(msg)); });
  async function api(path, opts = {}) {
    const headers = Object.assign({ Authorization: "tma " + initData }, opts.headers || {});
    const r = await fetch(path, Object.assign({}, opts, { headers }));
    if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
    return r.status === 204 ? null : r.json();
  }
  let me = null, pendingCount = 0;
  if (!initData) { document.querySelectorAll("main > section").forEach((s) => s.classList.add("hidden")); $("#gate").classList.remove("hidden"); $("#fab").classList.add("hidden"); applyI18n(); return; }

  $("#lang").addEventListener("change", () => { lang = $("#lang").value; try { localStorage.setItem("admin_lang", lang); } catch (e) {} applyI18n(); renderHouses(); renderUsers(); });

  // ---------- tabs ----------
  const loaders = { houses: loadHouses, users: loadUsers, stats: loadStats, admins: loadAdmins };
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
    document.querySelectorAll("main > section").forEach((s) => s.classList.toggle("hidden", s.id !== t.dataset.tab));
    $("#fab").classList.toggle("hidden", t.dataset.tab !== "houses");
    loaders[t.dataset.tab]();
  }));

  // ---------- houses ----------
  let houses = [], houseFilter = "all";
  document.querySelectorAll("#houses .chip").forEach((c) => c.addEventListener("click", () => { document.querySelectorAll("#houses .chip").forEach((x) => x.classList.toggle("active", x === c)); houseFilter = c.dataset.f; renderHouses(); }));
  async function loadHouses() {
    try { houses = await api("/api/houses"); pendingCount = houses.filter((h) => h.status === "pending").length; applyI18n(); renderHouses(); loadSyncInfo(); }
    catch (e) { $("#houses-list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  async function loadSyncInfo() {
    try { const s = await api("/api/stats"); const ls = s.last_sync;
      $("#sync-info").textContent = ls ? `${tr("sync_last")}: ${new Date(ls.finished_at || ls.started_at).toLocaleString()} · ${ls.seen}` + (ls.error ? " · " + tr("sync_err") : "") : tr("sync_never"); } catch (e) {}
  }
  $("#sync").addEventListener("click", async () => {
    const b = $("#sync"); b.disabled = true; b.textContent = tr("syncing");
    try { const r = await api("/api/sync", { method: "POST" }); haptic("success"); toast(tr("sync_done", { a: r.added, u: r.updated, d: r.deactivated })); await loadHouses(); }
    catch (e) { haptic("error"); toast(e.message); } finally { b.disabled = false; b.textContent = tr("sync"); }
  });
  function matches(h) {
    switch (houseFilter) {
      case "pending": return h.status === "pending"; case "active": return h.is_active && h.status === "approved"; case "hidden": return !h.is_active;
      case "clients": return h.is_client_ad; case "joymee": return h.source === "joymee"; case "manual": return h.source === "admin" && !h.is_client_ad; default: return true;
    }
  }
  function renderHouses() {
    if (!houses) return;
    const list = houses.filter(matches);
    if (!list.length) { $("#houses-list").innerHTML = `<div class="empty">${tr("empty")}</div>`; return; }
    $("#houses-list").innerHTML = list.map((h) => `
      <div class="card ${h.status === "pending" ? "pending" : ""}" data-id="${h.id}">
        ${h.photos[0] ? `<img class="thumb" loading="lazy" src="${photoUrl(h.photos[0])}" alt="">` : `<div class="thumb">🏠</div>`}
        <div class="body">
          <div class="title">#${h.id} ${esc(h.title)}
            ${h.status === "pending" ? `<span class="badge warn">${tr("b_pending")}</span>` : h.status === "rejected" ? `<span class="badge danger">${tr("b_rejected")}</span>` : `<span class="badge ${h.is_active ? "ok" : "off"}">${h.is_active ? tr("b_active") : tr("b_hidden")}</span>`}
            ${h.is_client_ad ? `<span class="badge violet">${tr("b_client")}</span>` : h.source === "admin" ? `<span class="badge" style="background:var(--warn)">${tr("b_manual")}</span>` : ""}</div>
          <div class="meta">📍 ${esc(h.district || h.address)}${h.rooms ? " · 🚪 " + h.rooms + " " + tr("rooms") : ""}${h.contact_phone ? " · 📞 " + esc(h.contact_phone) : ""}</div>
          ${h.is_client_ad ? `<div class="meta">👤 ${tr("owner")}: ${esc(h.owner_name || "")}${h.owner_username ? " @" + esc(h.owner_username) : ""} · ID ${h.owner_id}</div>` : ""}
          ${h.reject_reason ? `<div class="meta">${tr("reason")}: ${esc(h.reject_reason)}</div>` : ""}
          <div class="price">${priceStr(h)} ${tr("per_month")}${h.views ? ` <span style="color:var(--hint);font-weight:400;font-size:12px">· 👁 ${h.views}</span>` : ""}</div>
          <div class="actions">
            ${h.status === "pending" ? `<button class="ok" data-act="approve">${tr("approve")}</button><button class="danger" data-act="reject">${tr("reject")}</button>` : ""}
            ${h.status === "rejected" ? `<button class="ok" data-act="approve">${tr("approve")}</button>` : ""}
            ${h.status === "approved" ? `<button data-act="toggle">${h.is_active ? tr("hide") : tr("show")}</button>` : ""}
            ${h.source === "admin" ? `<button class="danger" data-act="del">${tr("del")}</button>` : ""}
          </div>
          <div class="reason hidden"><input maxlength="300"><button class="danger" data-act="reject-confirm">${tr("reject")}</button></div>
        </div>
      </div>`).join("");
    $("#houses-list").querySelectorAll(".reason input").forEach((i) => i.placeholder = tr("reject_reason"));
  }
  $("#houses-list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const card = btn.closest(".card"); const id = +card.dataset.id; const h = houses.find((x) => x.id === id);
    if (btn.dataset.act === "reject") { card.querySelector(".reason").classList.remove("hidden"); card.querySelector(".reason input").focus(); return; }
    btn.disabled = true;
    try {
      if (btn.dataset.act === "del") {
        if (!(await confirmDlg(tr("del_confirm", { id, t: h.title })))) { btn.disabled = false; return; }
        await api("/api/houses/" + id, { method: "DELETE" }); houses = houses.filter((x) => x.id !== id); haptic("success"); toast(tr("deleted"));
      } else if (btn.dataset.act === "toggle") {
        const upd = await api("/api/houses/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ is_active: !h.is_active }) }); Object.assign(h, upd); haptic("success");
      } else if (btn.dataset.act === "approve" || btn.dataset.act === "reject-confirm") {
        const status = btn.dataset.act === "approve" ? "approved" : "rejected";
        const reason = status === "rejected" ? card.querySelector(".reason input").value : "";
        const upd = await api(`/api/houses/${id}/moderate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status, reason }) });
        Object.assign(h, upd); haptic("success"); toast(status === "approved" ? tr("approved") : tr("rejected"));
        pendingCount = houses.filter((x) => x.status === "pending").length; applyI18n();
      }
      renderHouses();
    } catch (err) { haptic("error"); toast(err.message); btn.disabled = false; }
  });

  // ---------- add house modal ----------
  const modal = $("#modal"), form = $("#house-form");
  $("#fab").addEventListener("click", () => { form.reset(); modal.classList.remove("hidden"); });
  $("#cancel").addEventListener("click", () => modal.classList.add("hidden"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); const save = $("#save"); save.disabled = true; save.textContent = tr("saving");
    try { const h = await api("/api/houses", { method: "POST", body: new FormData(form) }); houses.unshift(h); renderHouses(); modal.classList.add("hidden"); haptic("success"); toast(tr("saved", { id: h.id })); }
    catch (err) { haptic("error"); toast(err.message); } finally { save.disabled = false; save.textContent = tr("save"); }
  });

  // ---------- users ----------
  let users = [], userBlocked = "all", qTimer;
  $("#user-q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(loadUsers, 300); });
  document.querySelectorAll("#users .chip").forEach((c) => c.addEventListener("click", () => { document.querySelectorAll("#users .chip").forEach((x) => x.classList.toggle("active", x === c)); userBlocked = c.dataset.b; loadUsers(); }));
  async function loadUsers() {
    try { const p = new URLSearchParams({ q: $("#user-q").value, blocked: userBlocked }); users = (await api("/api/users?" + p)).items; renderUsers(); }
    catch (e) { $("#users-list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function renderUsers() {
    if (!users) return;
    if (!users.length) { $("#users-list").innerHTML = `<div class="empty">${tr("u_empty")}</div>`; return; }
    $("#users-list").innerHTML = users.map((u) => `
      <div class="card" data-id="${u.telegram_id}">
        <div class="thumb">${u.is_blocked ? "🚫" : "👤"}</div>
        <div class="body">
          <div class="title">${esc(u.full_name) || "—"} ${u.is_blocked ? `<span class="badge danger">${tr("u_blocked").toLowerCase()}</span>` : ""}${u.registered ? `<span class="badge ok">${tr("registered")}</span>` : ""}</div>
          <div class="meta">${u.username ? "@" + esc(u.username) + " · " : ""}ID ${u.telegram_id}${u.phone ? " · 📞 " + esc(u.phone) : ""}${u.lang ? " · " + u.lang.toUpperCase() : ""}</div>
          ${u.is_blocked && u.block_reason ? `<div class="meta">${tr("reason")}: ${esc(u.block_reason)}</div>` : ""}
          <div class="actions">${u.is_blocked ? `<button class="ok" data-act="unblock">${tr("unblock")}</button>` : `<button class="danger" data-act="block">${tr("block")}</button>`}</div>
          <div class="reason hidden"><input maxlength="300" placeholder="${tr("block_reason")}"><button class="danger" data-act="block-confirm">${tr("block")}</button></div>
        </div>
      </div>`).join("");
  }
  $("#users-list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const card = btn.closest(".card"); const id = +card.dataset.id;
    if (btn.dataset.act === "block") { card.querySelector(".reason").classList.remove("hidden"); card.querySelector(".reason input").focus(); return; }
    btn.disabled = true;
    try {
      let upd;
      if (btn.dataset.act === "block-confirm") { upd = await api(`/api/users/${id}/block`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: card.querySelector(".reason input").value }) }); toast(tr("blocked")); }
      else { upd = await api(`/api/users/${id}/unblock`, { method: "POST" }); toast(tr("unblocked")); }
      haptic("success"); const i = users.findIndex((u) => u.telegram_id === id); if (i >= 0) users[i] = upd;
      if (userBlocked !== "all") await loadUsers(); else renderUsers();
    } catch (err) { haptic("error"); toast(err.message); btn.disabled = false; }
  });

  // ---------- stats ----------
  async function loadStats() {
    try {
      const s = await api("/api/stats"); const ls = s.last_sync;
      $("#stats-grid").innerHTML = [
        [tr("s_users"), s.users_total], [tr("s_registered"), s.users_registered], [tr("s_blocked"), s.users_blocked], [tr("s_favs"), s.favorites_total],
        [tr("s_total"), s.houses_total], [tr("s_active"), s.houses_active], [tr("s_pending"), s.houses_pending], [tr("s_clients"), s.houses_clients],
        [tr("s_auto"), s.houses_joymee], [tr("s_manual"), s.houses_admin], [tr("s_admins"), s.admins_total + " + " + (me && me.is_superadmin ? "★" : "")],
      ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")
      + `<div class="stat" style="grid-column:1/-1"><div class="l">${tr("s_last")}</div><div style="font-size:13px;margin-top:4px">${ls ? `${new Date(ls.finished_at || ls.started_at).toLocaleString()} — ${tr("s_seen")} ${ls.seen}, ${tr("s_new")} ${ls.added}, ${tr("s_upd")} ${ls.updated}, ${tr("s_closed")} ${ls.deactivated}${ls.error ? `<br><span style="color:var(--danger)">${tr("s_error")}: ${esc(ls.error)}</span>` : ""}` : tr("sync_never")}<br>${s.sync_interval_min ? tr("s_auto_every", { n: s.sync_interval_min }) : tr("s_auto_off")}</div></div>`;
    } catch (e) { $("#stats-grid").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  // ---------- admins (superadmin) ----------
  async function loadAdmins() {
    try {
      const r = await api("/api/admins");
      $("#admins-list").innerHTML = r.items.length ? r.items.map((a) => `
        <div class="card"><div class="thumb">${a.superadmin ? "⭐" : "🛡"}</div>
          <div class="body"><div class="title">${esc(a.full_name || a.note || "—")} ${a.superadmin ? `<span class="badge warn">${tr("a_super")}</span>` : ""}</div>
            <div class="meta">${a.username ? "@" + esc(a.username) + " · " : ""}ID ${a.telegram_id}${a.note ? " · " + esc(a.note) : ""}</div>
            ${a.superadmin ? "" : `<div class="actions"><button class="danger" data-rm="${a.telegram_id}">${tr("a_remove")}</button></div>`}</div></div>`).join("") : `<div class="empty">${tr("a_empty")}</div>`;
      $("#admins-list").querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", async () => {
        if (!(await confirmDlg(tr("a_remove_confirm", { id: b.dataset.rm })))) return;
        try { await api("/api/admins/" + b.dataset.rm, { method: "DELETE" }); toast(tr("a_removed")); loadAdmins(); } catch (e) { toast(e.message); }
      }));
    } catch (e) { $("#admins-list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  $("#a-add").addEventListener("click", async () => {
    const b = $("#a-add"); b.disabled = true;
    try { await api("/api/admins", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ telegram_id: $("#a-id").value.trim(), note: $("#a-note").value.trim() }) }); haptic("success"); toast(tr("a_added")); $("#a-id").value = ""; $("#a-note").value = ""; loadAdmins(); }
    catch (e) { haptic("error"); toast(e.message); } finally { b.disabled = false; }
  });

  // ---------- boot ----------
  api("/api/me").then((m) => {
    me = m; let saved = null; try { saved = localStorage.getItem("admin_lang"); } catch (e) {}
    lang = I18N[saved] ? saved : (I18N[m.lang] ? m.lang : "uz"); applyI18n();
    $("#who").textContent = m.name; if (m.is_superadmin) $("#tab-admins").classList.remove("hidden");
    loadHouses();
  }).catch((e) => { applyI18n(); document.querySelectorAll("main > section").forEach((s) => s.classList.add("hidden")); $("#gate").classList.remove("hidden"); $("#gate-msg").textContent = e.message; $("#fab").classList.add("hidden"); });
})();
</script>
</body>
</html>

# Render.com Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> shu repo'ni tanlang.
# BOT_TOKEN va ADMIN_IDS ni Render so'raganda qo'lda kiritasiz (sync: false).
services:
  - type: web
    name: chirchiq-arenda-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Baza Neon'da (doimiy bepul): Neon -> chirchiq-arenda -> Connect -> direct connection string.
      # Render dashboard'da qo'lda kiritiladi (maxfiy), blueprint uni o'zgartirmaydi.
      - key: DATABASE_URL
        sync: false
      # WEBAPP_URL avtomatik: Render RENDER_EXTERNAL_URL beradi, kod shuni oladi
      - key: KEEPALIVE_MIN
        value: "10"
      - key: SYNC_INTERVAL_MIN
        value: "30"
      - key: JOYMEE_DISTRICTS
        value: "166"
      - key: JOYMEE_CATEGORIES
        value: "4,5"
      - key: USD_RATE
        value: "12500"

# Eski Render bazasi (ma'lumotlar 2026-11-15 da Neon'ga ko'chirildi). Bot endi undan foydalanmaydi;
# bepul muddati tugagach (~1-dekabr) Render uni o'zi o'chiradi. Zaxira sifatida shu vaqtgacha qoldirildi.
databases:
  - name: chirchiq-arenda-db
    plan: free
    region: frankfurt
    databaseName: chirchiq_arenda
    user: chirchiq
